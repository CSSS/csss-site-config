upstream backend {
    server unix:/var/www/gunicorn.sock fail_timeout=0;
}

server {
    server_name sfucsss.org;
    http2 on;
    listen 80;

    root /var/www/html/main;

    access_log /var/www/logs/csss-site-backend/nginx-access.log;
    error_log /var/www/logs/csss-site-backend/nginx-error.log;

    location /media/ {
        alias /srv/csss/media/;

        autoindex off;

        expires 7d;
        add_header Cache-Control "public";
    }

    # REST API to csss-site-backend
    location /api/ {
        keepalive_timeout 5;
        client_max_body_size 20M; # Was 1G

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend;
    }

    location = /auth/verify {
        return 404;
    }

    location = /auth/validate {
        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend;
    }

    # Auth API to csss-site-backend
    location /auth/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend;
    }

    # Events had a URL scheme like `sfucsss.org/<event>/<year>[/<page>]`
    # We want to redirect them to `<event>.sfucsss.org[/<year>][/<page>]`
    location ~ "^/events/(mm|mountain_madness)/(?<year>\d{4})(?<page>/.*)$" {
        return 301 https://madness.sfucsss.org/$year$page;
    }

    # Since they used underscores before, we'll need to redirect URLs to the hyphenated version
    location ~ "^/events/(?<event>tech_fair|fall_hacks)(?<year>/\d{4})?(?<page>/.*)?$" {
        set $new_event "";
        if ($event = "tech_fair") {
            set $new_event "tech-fair";
        }
        if ($event = "fall_hacks") {
            set $new_event "fall-hacks";
        }
        return 301 https://$new_event.sfucsss.org$year$page;
    }

    # for the rest of the subdomains
    location ~ "^/events/(?<event>frosh|tech-fair|fall-hacks)(?<year>/\d{4})(?<page>/.*)?$" {
        return 301 https://$event.sfucsss.org$year$page;
    }

    location ~ ^/forms/ {
        alias /var/www/html/forms/;
        autoindex off;
        try_files $uri $uri.html;
    }

    location ~* "\.(woff2)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* "\.html$" {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        charset utf-8;
        index index.html index.csr.html;
        # Main site is a SPA, so we always serve the main Angular application
        try_files $uri $uri/ /index.csr.html;
        add_header Cache-Control "no-cache";
    }
}

# For test purposes
# Set to construction.html when not in use
server {
    server_name test.sfucsss.org;
    http2 on;
    listen 80;

    add_header X-Robots-Tag "noindex, nofollow" always;
    root /var/www/test-sfucsss;

    # location = / {
    #     try_files /construction.html =404;
    # }
    #
    location / {
        try_files $uri $uri/ /index.html =404;
        # return 404;
    }
}

server {
    listen 80 default_server;
    server_name _;

    return 444;
}
