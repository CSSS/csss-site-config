server {
    server_name docs.sfucsss.org;
    http2 on;
    listen 80;

    root /var/www/html/docs;
    index index.html;

    # Docs pages and unversioned files must be fetched again after a deploy.
    add_header Cache-Control "no-store" always;

    access_log /var/www/logs/csss-site-docs/nginx-access.log;
    error_log /var/www/logs/csss-site-docs/nginx-error.log;

    set $auth_required_role "exec";
    include snippets/auth-guard.conf;
    include snippets/errors.conf;
    include snippets/error-files.conf;
    error_page 401 = @login;

    # Astro assets have content-based names, so old URLs remain valid.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        auth_request /_auth;

        try_files $uri $uri/ /index.html =404;
    }
}
